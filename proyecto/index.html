<!DOCTYPE html>
<html lang="es">
<head>
    <title>Okotoko</title>
</head>
<body>
    <div class="ocean">
        <div class="wave"></div>
        <div class="wave"></div>
    </div>
    <div class="navbar">
        <div class="logo-container">
            <img src="logo.jpeg" alt="Logo">
            <span class="company-name">OKOTOKO</span>
        </div>
        <div class="nav-links">
            <a href="#catalogo">Catálogo</a>
            <a href="#contacto">Contáctanos</a>
            <a href="inicio_sesion.html">Iniciar Sesión</a>
        </div>
    </div>

    

    <div class = "imagen-mamalona">
        <img src="car_banner2.jpg" alt="Banner">
    </div>

    <div class="mas-vendidos" id="catalogo">
        <span>Popular</span>
        <div class="carros-populares">
            <a href="auto.html"><img src="kia_forte.webp" alt="Kia"></a>
            <a href="auto.html"><img src="ford_transit.webp" alt="Ford"></a>
            <a href="auto.html"><img src="seat_arpna.webp" alt="seat"></a>
        </div>
    </div>
    <div class="mas-vendidos">
        <span>Ofertas</span>
        <div class="carros-populares">
            <a href="auto.html"><img src="audi_a3.webp" alt="Kia"></a>
            <a href="auto.html"><img src="fiat_mobi.webp" alt="Ford"></a>
            <a href="auto.html"><img src="volkswagen_vento.webp" alt="seat"></a>
        </div>
    </div>
    <div class="appointment">
        <h2>Agendar una Cita</h2>
        <form action="#" method="post">
            <label for="fecha">Fecha:</label>
            <input type="date" id="fecha" name="fecha" required>

            <label for="hora">Hora:</label>
            <input type="time" id="hora" name="hora" required>

            <a href="formulario_cita.html" class="boton-agendar">Agendar</a>

        </form>
    </div>
    

    <div class="contact" id="contacto">
        <h2>Contáctanos</h2>
        <p>Correo: contacto@okotoko.com</p>
        <p>Teléfono: +52 123 456 7890</p>
        <div class="social">
            <a href="#"><img src="facebook.png" alt="Facebook"></a>
            <a href="#"><img src="x_logo.png" alt="Twitter"></a>
            <a href="#"><img src="instagram.png" alt="Instagram"></a>
        </div>
    </div>

    

    <script>
        const imagenes = document.querySelectorAll('.carros-populares img');

        imagenes.forEach(imagen => {
            imagen.addEventListener('mouseenter', () => {
                imagen.style.transform = 'scale(1.05)';
                imagen.style.transition = 'transform 0.3s ease';
            });

            imagen.addEventListener('mouseleave', () => {
                imagen.style.transform = 'scale(1)';
            });
        });

    </script>

  

</body>
</html>

<style>

    
    .ocean {
        height: 5%;
        width: 100%;
        position: fixed; /* <-- importante: antes era absolute */
        bottom: 0;
        left: 0;
        background: #9ca3a5;
    }

    .wave {
    background: url(https://cdn.kcak11.com/codepen_assets/wave_animation/wave.svg) repeat-x;
    position: absolute;
    top: -198px;
    width: 6400px;
    height: 198px;
    animation: wave 7s cubic-bezier(0.36, 0.45, 0.63, 0.53) infinite;
    transform: translate3d(0, 0, 0);
    filter: brightness(0.1) grayscale(100%);
    opacity: 0.2;
    }

    .wave:nth-of-type(2) {
    top: -175px;
    animation: wave 7s cubic-bezier(0.36, 0.45, 0.63, 0.53) -0.125s infinite, swell 7s ease -1.25s infinite;
    opacity: 1;
    }

    @keyframes wave {
    0% {
        margin-left: 0;
    }
    100% {
        margin-left: -1600px;
    }
    }
    @keyframes swell {
    0%,
    100% {
        transform: translate3d(0, -25px, 0);
    }
    50% {
        transform: translate3d(0, 5px, 0);
    }
    }
    .endWave{
    display:none;
    }
    
    body {
        background-color: radial-gradient(ellipse at center, #fffeea 0%, #fffeea 35%, #95a3a4 100%);
        height: auto;
        min-height: 100%;
        margin: 0;
        font-family: Arial, sans-serif;
    }

    /* Barra de navegación */
    .navbar {
        background-color: white;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 20px;
        box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.1);
    }

    .navbar img {
        width: 100px;
        height: 100px;
    }
     /* Contenedor del logo y nombre */
     .logo-container {
            display: flex;
            align-items: center;
        }

        .logo-container img {
            width: 100px;
            height: 100px;
        }

        .company-name {
            font-size: 24px;
            font-weight: bold;
            margin-left: 10px;
            color: black;
        }
    .nav-links {
        display: flex;
        gap: 40px;
    }

    .nav-links a {
        text-decoration: none;
        color: black;
        font-weight: bold;
        font-size: 18px;
    }

    .nav-links a:hover {
        color: darkblue;
    }

    .imagen-mamalona img{
        padding-top: 60px;
        padding-bottom: 60px;
        width: 100%;
        height: 270px;
    }
    .mas-vendidos {
        background-color: white;
        text-align: center;
        padding: 20px 0;
        font-size: 50px;
    }

    .carros-populares img{
        width: 300px;
        height: 200px;
        padding-left: 100px;
        padding-top: 50px;
    }
    .appointment {
        background-color: white;
        margin: 20px auto;
        padding: 20px;
        max-width: 400px;
        box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.1);
        border-radius: 5px;
    }
    .appointment h2 {
        text-align: center;
    }
    .appointment form {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .appointment label {
        font-weight: bold;
    }
    .appointment input {
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 3px;
    }
    .appointment button {
        padding: 10px;
        background-color: darkblue;
        color: white;
        border: none;
        border-radius: 3px;
        cursor: pointer;
        font-size: 16px;
    }
    .appointment button:hover {
        background-color: blue;
    }
    .contact {
        background-color: white;
        padding: 20px;
        text-align: center;
        margin-top: 20px;
    }

    .contact h2 {
        margin-bottom: 10px;
    }

    .contact p {
        margin: 5px 0;
    }

    .contact .social a {
        margin: 0 10px;
        display: inline-block;
    }

    .contact .social img {
        width: 30px;
        height: 30px;
    }

    .boton-agendar {
        display: block;
        text-align: center;
        padding: 10px;
        background-color: darkblue;
        color: white;
        text-decoration: none;
        border-radius: 3px;
        font-size: 16px;
        margin-top: 10px;
    }
    .boton-agendar:hover {
        background-color: blue;
    }

  
</style>
