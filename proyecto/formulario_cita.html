<!DOCTYPE html>
<html lang="es">
<head>
    <title>Agendar Cita - Okotoko</title>
</head>
<body>
    <div class="formulario-cita">
        <h2>Agendar Cita</h2>
        <form id="citaForm" action="#" method="post" onsubmit="mostrarMensaje(event)">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" name="apellido" required>

            <label for="telefono">Número de Teléfono:</label>
            <input type="tel" id="telefono" name="telefono" required>

            <label for="ciudad">Ciudad:</label>
            <input type="text" id="ciudad" name="ciudad" required>

            <button type="submit">Enviar</button>
        </form>

        <div id="mensaje-exito" style="display:none; margin-top:20px; color:green; font-weight:bold; text-align: center;">
            ¡Cita agendada exitosamente!
            <br><br>
            <a href="index.html">
                <img src="https://cdn-icons-png.flaticon.com/512/25/25694.png" alt="Inicio" class="icono-casa">
            </a>
        </div>
    </div>

    <script>
    function mostrarMensaje(event) {
        event.preventDefault(); // Evitar recargar página
        document.getElementById('citaForm').style.display = 'none'; // Ocultar formulario
        document.getElementById('mensaje-exito').style.display = 'block'; // Mostrar mensaje
    }
    </script>
    
</body>
</html>

<style>
body {
    background-color: lightgray;
    margin: 0;
    font-family: Arial, sans-serif;
}

.formulario-cita {
    max-width: 400px;
    margin: 100px auto;
    background-color: white;
    padding: 20px;
    box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.1);
    border-radius: 5px;
}

.formulario-cita h2 {
    text-align: center;
    margin-bottom: 20px;
}

.formulario-cita form {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.formulario-cita label {
    font-weight: bold;
}

.formulario-cita input {
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 3px;
}

.formulario-cita button {
    padding: 10px;
    background-color: darkblue;
    color: white;
    border: none;
    border-radius: 3px;
    cursor: pointer;
    font-size: 16px;
}

.formulario-cita button:hover {
    background-color: blue;
}

.icono-casa {
    width: 50px;
    height: 50px;
    margin-top: 10px;
    transition: transform 0.3s;
}

.icono-casa:hover {
    transform: scale(1.2);
}

.texto-inicio {
    text-decoration: none;
    color: darkblue;
    font-weight: bold;
}

.texto-inicio:hover {
    text-decoration: underline;
}
</style>
